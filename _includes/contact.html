  <section class="section" id="contact">
    <h2 class="section-label">{{ contact_label | escape }}</h2>
    <p class="about-text contact-text">{{ d.labels.contact_text | escape }}</p>
    <div class="contact-links">
      <a class="contact-link" href="mailto:{{ d.contact.email }}">
        <span class="contact-link-label">Email</span>
        {{ d.contact.email | escape }}
      </a>
      <a class="contact-link" href="https://{{ d.contact.linkedin }}">
        <span class="contact-link-label">LinkedIn</span>
        {{ d.contact.linkedin | escape }}
      </a>
      <a class="contact-link" href="https://{{ d.contact.github }}">
        <span class="contact-link-label">GitHub</span>
        {{ d.contact.github | escape }}
      </a>
      <a class="contact-link" href="{{ d.pdf }}">
        <span class="contact-link-label">CV</span>
        {{ d.labels.full_cv | escape }}
      </a>
    </div>
  </section>
